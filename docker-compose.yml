services:
  # Opción 1: Suite Completa con GUI Webtop en el navegador (:3000)
  llama-launcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-launcher-webtop
    security_opt:
      - seccomp:unconfined # Recomendado para entornos de escritorio Webtop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8082
      - DEFAULT_LOCAL_BACKEND=http://127.0.0.1:8080
    ports:
      - "3000:3000"  # Interfaz gráfica de escritorio en el navegador (WebTop)
      - "8080:8080"  # Endpoint de inferencia llama-server interno en contenedor
      - "8082:8082"  # Gateway interno (mapeado a 8082 para no colisionar con atomic-ai-gateway en 8081)
    volumes:
      - ./models:/app/models
      - ./llamaLauncher/logs:/app/llamaLauncher/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb" # Previene cierres inesperados de WebKit en Webtop
    restart: unless-stopped

  # Opción 2: Gateway Headless ultra-liviano (:8081 / :8082)
  # Útil si ejecutas llama-server nativamente en Windows (con CUDA/Vulkan)
  # y solo requieres el Gateway desacoplado en contenedor.
  inference-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: llamalaunch-inference-gateway
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=${GATEWAY_PORT:-8081}
      - DEFAULT_LOCAL_BACKEND=http://host.docker.internal:8080
      - DESKTOP_BACKEND_URL=http://host.docker.internal:8080
      - LAPTOP_BACKEND_URL=http://host.docker.internal:8080
    ports:
      - "${GATEWAY_PORT:-8081}:${GATEWAY_PORT:-8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - gateway-only
