services:
  # LlamaLaunch Web App (:3000) — Aplicación web limpia directa en el navegador
  llama-launcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-launcher-web
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=3000
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8082
      - DEFAULT_LOCAL_BACKEND=http://host.docker.internal:8080
      - DESKTOP_BACKEND_URL=http://host.docker.internal:8080
      - LAPTOP_BACKEND_URL=http://host.docker.internal:8080
    ports:
      - "3000:3000"  # Interfaz Web directa de LlamaLaunch (abre limpia en el navegador)
      - "8080:8080"  # llama-server endpoint
      - "8082:8082"  # Inference Gateway interno
    volumes:
      - ./models:/app/models
      - ./llamaLauncher/logs:/app/llamaLauncher/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Opción Headless: Solo el Gateway ultra-liviano (:8081)
  inference-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: llamalaunch-inference-gateway
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=${GATEWAY_PORT:-8081}
      - DEFAULT_LOCAL_BACKEND=http://host.docker.internal:8080
      - DESKTOP_BACKEND_URL=http://host.docker.internal:8080
      - LAPTOP_BACKEND_URL=http://host.docker.internal:8080
    ports:
      - "${GATEWAY_PORT:-8081}:${GATEWAY_PORT:-8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - gateway-only
